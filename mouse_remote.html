<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>スマホマウス</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    height: 100%;
    margin: 0;
    background: #1c1c1e;
    color: #eee;
    font-family: -apple-system, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
  }
  #padStatus {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #888;
    z-index: 1;
  }
  #pad {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  #padMain {
    flex: 1;
    display: flex;
    flex-direction: row;
    min-height: 0;
  }
  #touchArea {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  #scrollZone {
    width: 48px;
    background: #262628;
    border-left: 1px solid #3a3a3c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 11px;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
  }
  #bar {
    display: flex;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #bar button {
    flex: 1;
    padding: 18px 0;
    background: #2c2c2e;
    color: #eee;
    border: none;
    border-top: 1px solid #3a3a3c;
    font-size: 15px;
  }
  #bar button:active { background: #48484a; }
  #bar button + button { border-left: 1px solid #3a3a3c; }

  #keyboardPanel {
    display: none;
    position: fixed;
    inset: 0;
    background: #1c1c1ecc;
    z-index: 10;
    flex-direction: column;
    justify-content: flex-end;
  }
  #textInput {
    width: 100%;
    height: 120px;
    font-size: 16px;
    padding: 10px;
    border: none;
    box-sizing: border-box;
  }
  #keyboardPanel .kbRow { display: flex; }
  #keyboardPanel .kbRow button {
    flex: 1;
    padding: 16px;
    font-size: 15px;
    background: #2c2c2e;
    color: #eee;
    border: none;
    border-top: 1px solid #3a3a3c;
  }
  #keyboardPanel .kbRow button + button { border-left: 1px solid #3a3a3c; }
</style>
</head>
<body>

<div id="pad">
  <div id="padStatus">接続中...</div>
  <div id="padMain">
    <div id="touchArea">
      ここを指でなぞってカーソルを移動<br>
      タップ=左クリック / 長押し=右クリック
    </div>
    <div id="scrollZone">スクロール</div>
  </div>
  <div id="bar">
    <button ontouchstart="clickLeft(event)">左クリック</button>
    <button ontouchstart="clickRight(event)">右クリック</button>
    <button ontouchstart="openKeyboard(event)">⌨️ キーボード</button>
  </div>
</div>

<div id="keyboardPanel">
  <textarea id="textInput"></textarea>
  <div class="kbRow">
    <button ontouchstart="sendText(event)">送信</button>
    <button ontouchstart="sendEnter(event)">Enter</button>
    <button ontouchstart="closeKeyboard(event)">閉じる</button>
  </div>
</div>

<script>
let pc = null;
let channel = null;

// 感度（大きいほど、同じ指の動きで大きく動く）
const MOVE_SENSITIVITY = 2.5;
const SCROLL_SENSITIVITY = 4;

async function connect() {
  const status = document.getElementById('padStatus');
  status.textContent = '接続中...';

  pc = new RTCPeerConnection();

  // 信頼性なしモード：多少データが欠けても再送を待たず、
  // とにかく最新の移動量を素早く届ける（回線が悪い環境向け）
  channel = pc.createDataChannel('mouse', {
    ordered: false,
    maxRetransmits: 0,
  });

  channel.onopen = () => { status.textContent = ''; };
  channel.onclose = () => {
    status.textContent = '切断されました。再接続中...';
    setTimeout(connect, 1500);
  };

  const offerDesc = await pc.createOffer();
  await pc.setLocalDescription(offerDesc);

  // ICE候補の収集完了を待つ（ローカル通信のみなのでこれで十分）
  await new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') {
      resolve();
    } else {
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') resolve();
      });
    }
  });

  try {
    const res = await fetch('/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sdp: pc.localDescription.sdp,
        type: pc.localDescription.type,
      }),
    });
    const answer = await res.json();
    await pc.setRemoteDescription(answer);
  } catch (e) {
    status.textContent = '接続失敗。PCサーバーが起動しているか確認してください';
    setTimeout(connect, 2000);
  }
}

function send(obj) {
  if (channel && channel.readyState === 'open') {
    channel.send(JSON.stringify(obj));
  }
}

function clickLeft(e) { e.preventDefault(); send({type: 'click'}); }
function clickRight(e) { e.preventDefault(); send({type: 'rightclick'}); }

// --- キーボード入力パネル ---
function openKeyboard(e) {
  e.preventDefault();
  document.getElementById('keyboardPanel').style.display = 'flex';
  document.getElementById('textInput').focus();
}
function closeKeyboard(e) {
  e.preventDefault();
  document.getElementById('textInput').blur();
  document.getElementById('keyboardPanel').style.display = 'none';
}
function sendText(e) {
  e.preventDefault();
  const el = document.getElementById('textInput');
  if (el.value) {
    send({type: 'text', text: el.value});
    el.value = '';
  }
}
function sendEnter(e) {
  e.preventDefault();
  send({type: 'key', key: 'enter'});
}

window.addEventListener('load', connect);

// --- タッチパッド操作 ---
const touchArea = document.getElementById('touchArea');
let lastX = 0, lastY = 0;
let startTime = 0;
let moved = false;
let longPressTimer = null;
let didLongPress = false;
let touchCount = 0;

touchArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  send({type: 'stop'}); // 前の操作の惰性が残っていれば打ち切る
  touchCount = e.touches.length;
  moved = false;
  didLongPress = false;
  startTime = Date.now();
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;

  if (touchCount === 1) {
    longPressTimer = setTimeout(() => {
      if (!moved) {
        didLongPress = true;
        send({type: 'rightclick'});
      }
    }, 500);
  }
}, { passive: false });

touchArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    const dx = x - lastX;
    const dy = y - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      moved = true;
      clearTimeout(longPressTimer);
      send({type: 'move', dx: dx * MOVE_SENSITIVITY, dy: dy * MOVE_SENSITIVITY});
    }
    lastX = x;
    lastY = y;
  } else if (e.touches.length === 2) {
    moved = true;
    clearTimeout(longPressTimer);
    const y = e.touches[0].clientY;
    const dy = y - lastY;
    send({type: 'scroll', amount: -dy * SCROLL_SENSITIVITY});
    lastY = y;
  }
}, { passive: false });

touchArea.addEventListener('touchend', (e) => {
  e.preventDefault();
  clearTimeout(longPressTimer);
  const duration = Date.now() - startTime;
  if (!moved && !didLongPress && duration < 400 && touchCount === 1) {
    send({type: 'click'});
  }
  if (e.touches.length === 0) {
    send({type: 'stop'}); // 指が完全に離れたら惰性を打ち切る
  }
}, { passive: false });

// --- 片手用スクロールゾーン（右端を1本指でなぞるとスクロール） ---
const scrollZone = document.getElementById('scrollZone');
let scrollLastY = 0;

scrollZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  scrollLastY = e.touches[0].clientY;
}, { passive: false });

scrollZone.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const y = e.touches[0].clientY;
  const dy = y - scrollLastY;
  send({type: 'scroll', amount: -dy * SCROLL_SENSITIVITY});
  scrollLastY = y;
}, { passive: false });
</script>

</body>
</html>
